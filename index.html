<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1720">
  <meta name="robots" content="noindex, nofollow">
  <title>Anlagen</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand">Anlagen</div>
    <div class="top-actions">
      <span id="stand" class="muted small"></span>
      <button id="btn-reload" class="icon-btn" title="Neu laden" aria-label="Neu laden" hidden>↻</button>
      <button id="btn-logout" class="icon-btn" title="Abmelden" aria-label="Abmelden" hidden>⎋</button>
    </div>
  </header>

  <main id="app">
    <section id="login" class="login" hidden>
      <h1>Portfolio</h1>
      <p class="muted">Anmeldung mit dem Google-Konto, das Zugriff auf „Anlagen-DB“ hat.</p>
      <button id="btn-login" class="primary">Mit Google anmelden</button>
      <p id="login-err" class="err"></p>
    </section>

    <div id="content" hidden>
      <section id="view-uebersicht" class="view"></section>
      <section id="view-positionen" class="view" hidden></section>
      <section id="view-historie" class="view" hidden></section>
      <section id="view-erfassen" class="view" hidden></section>
    </div>
    <p id="global-err" class="err banner" hidden></p>
  </main>

  <nav class="tabs" id="tabs" hidden>
    <a href="#uebersicht" data-view="uebersicht">Übersicht</a>
    <a href="#positionen" data-view="positionen">Positionen</a>
    <a href="#historie" data-view="historie">Historie</a>
    <a href="#erfassen" data-view="erfassen">Erfassen</a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
